plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whisper.wowaudio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.whisper.wowaudio'
        minSdk 24
        targetSdk 36
        versionCode 16
        versionName '1.9.1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['onnx']
    }

    buildTypes {
        debug {
            // Test builds stay installable beside the permanently-signed production WoW Audio.
            // Release builds keep the real com.whisper.wowaudio package unchanged.
            applicationIdSuffix '.f5test'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    // Shared ONNX Runtime used by the offline Burmese safety fallback.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
    testImplementation 'junit:junit:4.13.2'
}
