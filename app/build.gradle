plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whisper.wowaudio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.whisper.wowaudio'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        // Keep the self-contained test build useful on current Myanmar Android phones
        // without carrying emulator ABIs in the APK.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Sherpa reads the ONNX model directly through AssetManager. Keeping it
        // uncompressed avoids an extra 114 MB decompression/copy at runtime.
        noCompress += ['onnx']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'
    implementation files('libs/sherpa-onnx-1.13.7.aar')
}
