name: Apply F5 Myanmar Default Voice

on:
  push:
    branches:
      - feature/v1.9.0-aung-gyi-f5-local
    paths:
      - '.github/workflows/apply-f5-default-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.9.0-aung-gyi-f5-local
      - name: Apply verified default voice patch
        run: python3 tools/apply_f5_default_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowaudio/HuggingFaceF5Client.java app/src/main/java/com/whisper/wowaudio/F5LocalTtsEngine.java app/src/main/java/com/whisper/wowaudio/AudioCache.java app/src/main/java/com/whisper/wowaudio/AudiobookService.java app/src/main/java/com/whisper/wowaudio/SettingsActivity.java app/src/main/java/com/whisper/wowaudio/VoiceSettings.java
          git commit -m 'Use verified F5 Myanmar default online voice'
          git push origin HEAD:feature/v1.9.0-aung-gyi-f5-local
