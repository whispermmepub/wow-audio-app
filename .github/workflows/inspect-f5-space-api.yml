name: Inspect F5 Myanmar Space API

on:
  push:
    branches:
      - feature/v1.9.0-aung-gyi-f5-local
    paths:
      - '.github/workflows/inspect-f5-space-api.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public Gradio API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://freococo-f5-myanmar-tts-demo.hf.space'
          curl -fsSL --max-time 60 "$BASE/gradio_api/openapi.json" -o /tmp/openapi.json
          curl -fsSL --max-time 60 "$BASE/config" -o /tmp/config.json
          python3 - <<'PY'
          import json, pprint
          p=json.load(open('/tmp/openapi.json'))
          print('=== EXACT GENERATE SPEC ===')
          pprint.pp(p.get('paths',{}).get('/gradio_api/call/v2/generate_speech',{}))
          print('=== UPLOAD SPEC ===')
          pprint.pp(p.get('paths',{}).get('/gradio_api/upload',{}))
          print('=== RELEVANT SCHEMAS ===')
          schemas=p.get('components',{}).get('schemas',{})
          for name,schema in schemas.items():
              low=name.lower()
              if any(k in low for k in ('generate','file','upload')):
                  print('SCHEMA',name)
                  pprint.pp(schema)
          c=json.load(open('/tmp/config.json'))
          print('=== CONFIG DEPENDENCY ===')
          comps={x.get('id'):x for x in c.get('components',[])}
          for d in c.get('dependencies',[]):
              if d.get('api_name')=='generate_speech':
                  pprint.pp(d)
                  for i in d.get('inputs',[]):
                      print('INPUT COMPONENT',i)
                      pprint.pp(comps.get(i,{}))
                  for i in d.get('outputs',[]):
                      print('OUTPUT COMPONENT',i)
                      pprint.pp(comps.get(i,{}))
          PY
