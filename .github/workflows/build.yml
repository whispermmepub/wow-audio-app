name: Build WoW Audio

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'

      - name: Verify handoff contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowaudio'" app/build.gradle
          grep -q "com.whisper.wowaudio.action.OPEN_BOOK" app/src/main/AndroidManifest.xml
          grep -q "application/epub+zip" app/src/main/AndroidManifest.xml
          grep -q "application/pdf" app/src/main/AndroidManifest.xml
          grep -q "importToPrivateStorage" app/src/main/java/com/whisper/wowaudio/MainActivity.java
          git diff --check

      - name: Build and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintRelease --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowaudio'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='2'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='0.2.0'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v0.2.0-BYOK-TTS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
