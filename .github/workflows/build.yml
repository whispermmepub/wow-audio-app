name: Build clean WoW Audio

on:
  push:
    branches: [main, 'rebuild/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Verify clean direct-reader contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowaudio'" app/build.gradle
          grep -q "versionCode 1" app/build.gradle
          grep -q "versionName '1.0.0'" app/build.gradle
          grep -q "TextToSpeech" app/src/main/java/com/whisper/wowaudio/ReadingService.java
          grep -q "new Locale(\"my\", \"MM\")" app/src/main/java/com/whisper/wowaudio/ReadingService.java
          grep -q "Delete Book" app/src/main/java/com/whisper/wowaudio/MainActivity.java
          grep -q "ACTION_OPEN_DOCUMENT" app/src/main/java/com/whisper/wowaudio/MainActivity.java
          ! grep -R -q "GeminiTtsClient\|GenerationQueueStore\|NarrationGenerationService" app/src/main/java || true
          git diff --check
      - name: Build and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintRelease --stacktrace
      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowaudio'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='1'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='1.0.0'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-clean-v1.0.0-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-clean-v1.0.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 3
          if-no-files-found: error
