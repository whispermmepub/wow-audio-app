name: Build WoW Audio

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      WOW_AUDIO_STORE_PASSWORD: ${{ secrets.WOW_AUDIO_STORE_PASSWORD }}
      WOW_AUDIO_KEY_ALIAS: ${{ secrets.WOW_AUDIO_KEY_ALIAS }}
      WOW_AUDIO_KEY_PASSWORD: ${{ secrets.WOW_AUDIO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'

      - name: Configure stable update signing when secrets exist
        shell: bash
        env:
          WOW_AUDIO_KEYSTORE_B64: ${{ secrets.WOW_AUDIO_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${WOW_AUDIO_KEYSTORE_B64:-}" && -n "${WOW_AUDIO_STORE_PASSWORD:-}" && -n "${WOW_AUDIO_KEY_ALIAS:-}" && -n "${WOW_AUDIO_KEY_PASSWORD:-}" ]]; then
            KEYSTORE="$RUNNER_TEMP/wow-audio-update.jks"
            printf '%s' "$WOW_AUDIO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "WOW_AUDIO_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "WOW_AUDIO_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "WOW_AUDIO_STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Verify handoff and accessibility contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowaudio'" app/build.gradle
          grep -q "versionCode 5" app/build.gradle
          grep -q "versionName '1.1.0'" app/build.gradle
          grep -q "com.whisper.wowaudio.action.OPEN_BOOK" app/src/main/AndroidManifest.xml
          grep -q "application/epub+zip" app/src/main/AndroidManifest.xml
          grep -q "application/pdf" app/src/main/AndroidManifest.xml
          grep -q "importToPrivateStorage" app/src/main/java/com/whisper/wowaudio/MainActivity.java
          grep -q "SEND_MULTIPLE" app/src/main/AndroidManifest.xml
          grep -q "ShareImportActivity" app/src/main/AndroidManifest.xml
          grep -q "NarrationGenerationService" app/src/main/AndroidManifest.xml
          grep -q "Preparing automatically" app/src/main/java/com/whisper/wowaudio/MainActivity.java
          grep -q "setAccessibilityHeading" app/src/main/java/com/whisper/wowaudio/MainActivity.java
          git diff --check

      - name: Build and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintRelease --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowaudio'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='5'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='1.1.0'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Verify stable signing certificate
        if: env.WOW_AUDIO_STABLE_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          EXPECTED_SHA256="5F58AB463C3A43275DD768FB3BDB2AAEF388B5C18A4D6076B0C5339B4AEE0FE1"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' | tr -d ':')
            [[ "$ACTUAL" == "$EXPECTED_SHA256" ]]
          done

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.1.0-accessible-auto-audio-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload release package for first stable signing
        if: env.WOW_AUDIO_STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.1.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload stable update APK
        if: env.WOW_AUDIO_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.1.0-stable-update-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
