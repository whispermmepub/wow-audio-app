name: Build WoW Audio v1.9.0 Aung Gyi local voice

on:
  push:
    branches: [main, 'rebuild/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WOW_AUDIO_KEYSTORE_B64: ${{ secrets.WOW_AUDIO_KEYSTORE_B64 }}
      WOW_AUDIO_STORE_PASSWORD: ${{ secrets.WOW_AUDIO_STORE_PASSWORD }}
      WOW_AUDIO_KEY_ALIAS: ${{ secrets.WOW_AUDIO_KEY_ALIAS }}
      WOW_AUDIO_KEY_PASSWORD: ${{ secrets.WOW_AUDIO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'

      - name: Fetch pinned offline Burmese fallback
        run: bash tools/fetch_offline_tts.sh

      - name: Smoke-test offline Burmese fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "sherpa-onnx==1.13.7"
          python3 - <<'PY'
          import sherpa_onnx
          model = "app/src/main/assets/tts/mya/model.onnx"
          tokens = "app/src/main/assets/tts/mya/tokens.txt"
          config = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=model, tokens=tokens, data_dir=""),
                  num_threads=2, debug=False, provider="cpu"),
              max_num_sentences=1)
          assert config.validate()
          tts = sherpa_onnx.OfflineTts(config)
          audio = tts.generate("မင်္ဂလာပါ မြန်မာနိုင်ငံ", sid=0, speed=1.0)
          samples = list(audio.samples)
          assert int(audio.sample_rate) > 0 and len(samples) > 1000
          assert max(abs(float(x)) for x in samples) > 0.00010
          PY

      - name: Smoke-test Nilar and Thiha natural online voices
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "edge-tts==7.2.8"
          edge-tts --list-voices > /tmp/voices.txt
          grep -q 'my-MM-NilarNeural' /tmp/voices.txt
          grep -q 'my-MM-ThihaNeural' /tmp/voices.txt
          edge-tts --voice my-MM-NilarNeural --text 'မင်္ဂလာပါ။ WoW Audio မှ ကြိုဆိုပါတယ်။' --write-media /tmp/nilar.mp3
          edge-tts --voice my-MM-ThihaNeural --text 'မင်္ဂလာပါ။ WoW Audio မှ ကြိုဆိုပါတယ်။' --write-media /tmp/thiha.mp3
          test "$(stat -c%s /tmp/nilar.mp3)" -gt 3000
          test "$(stat -c%s /tmp/thiha.mp3)" -gt 3000

      - name: Verify v1.9.0 audiobook contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowaudio'" app/build.gradle
          grep -q "applicationIdSuffix '.f5test'" app/build.gradle
          grep -q "minSdk 24" app/build.gradle
          grep -q "versionCode 15" app/build.gradle
          grep -q "versionName '1.9.0'" app/build.gradle
          grep -q 'burmese-prosody-v4-pause-boundaries' app/src/main/java/com/whisper/wowaudio/BurmeseProsody.java
          grep -q 'Pause clearly at Burmese full stops' app/src/main/java/com/whisper/wowaudio/BurmeseProsody.java
          grep -q 'Structural newlines must not be swallowed' app/src/main/java/com/whisper/wowaudio/TtsText.java
          grep -q 'Never cross-read a different Edge voice' app/src/main/java/com/whisper/wowaudio/AudiobookService.java
          grep -q 'STYLE_GEMINI_EXPRESSIVE' app/src/main/java/com/whisper/wowaudio/VoiceSettings.java
          grep -q 'ENGINE_F5' app/src/main/java/com/whisper/wowaudio/VoiceSettings.java
          grep -q 'F5LocalTtsEngine' app/src/main/java/com/whisper/wowaudio/AudiobookService.java
          grep -q 'HuggingFaceF5Client' app/src/main/java/com/whisper/wowaudio/F5LocalTtsEngine.java
          grep -q 'onnxruntime-android:1.29.0' app/build.gradle
          grep -q 'VIEW_SMALL_LIST' app/src/main/java/com/whisper/wowaudio/LibraryActivity.java
          grep -q 'VIEW_SMALL_GRID' app/src/main/java/com/whisper/wowaudio/LibraryActivity.java
          grep -q 'my-MM-NilarNeural' app/src/main/java/com/whisper/wowaudio/EdgeMyanmarTtsClient.java
          grep -q 'my-MM-ThihaNeural' app/src/main/java/com/whisper/wowaudio/EdgeMyanmarTtsClient.java
          test -s app/src/main/assets/tts/mya/model.onnx
          test -s app/src/main/assets/tts/mya/tokens.txt
          test -s app/libs/sherpa-onnx-1.13.7.aar
          if unzip -l app/libs/sherpa-onnx-1.13.7.aar | grep -q 'libonnxruntime.so'; then
            echo 'Sherpa AAR still contains duplicate libonnxruntime.so' >&2
            exit 1
          fi
          git diff --check

      - name: Test speech cleanup and pause prosody, build and lint
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --tests com.whisper.wowaudio.TtsTextTest --tests com.whisper.wowaudio.BurmeseProsodyTest --stacktrace
          gradle :app:assembleDebug :app:assembleRelease :app:lintRelease --stacktrace

      - name: Verify APK identity and fallback assets
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowaudio.f5test'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='15'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='1.9.0'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'24'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/tts/mya/model.onnx'
          unzip -l "$APK" | grep -q 'assets/tts/mya/tokens.txt'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonnxruntime.so'
          test "$(unzip -l "$APK" | grep -c 'lib/arm64-v8a/libonnxruntime.so')" -eq 1
          ls -lh "$APK"

      - name: Export apksigner utility for local private-key signing
        shell: bash
        run: |
          set -euo pipefail
          SIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -s "$SIGNER_JAR"
          cp "$SIGNER_JAR" /tmp/apksigner.jar

      - name: Upload apksigner utility
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-apksigner-tool
          path: /tmp/apksigner.jar
          retention-days: 1
          if-no-files-found: error

      - name: Decode permanent update keystore
        if: env.WOW_AUDIO_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WOW_AUDIO_KEYSTORE_B64" | base64 --decode > /tmp/WoW-Audio-update-key.jks
          chmod 600 /tmp/WoW-Audio-update-key.jks

      - name: Sign update-install APK with permanent key
        if: env.WOW_AUDIO_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/WoW-Audio-v1.9.0-Aung-Gyi-UPDATE-signed.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks /tmp/WoW-Audio-update-key.jks --ks-key-alias "$WOW_AUDIO_KEY_ALIAS" --ks-pass env:WOW_AUDIO_STORE_PASSWORD --key-pass env:WOW_AUDIO_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/apksigner.txt
          grep -qi '5f58ab463c3a43275dd768fb3bdb2aaef388b5c18a4d6076b0c5339b4aee0fe1' /tmp/apksigner.txt

      - name: Upload v1.9.0 update-install signed APK
        if: env.WOW_AUDIO_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.9.0-Aung-Gyi-UPDATE-signed
          path: app/build/outputs/apk/release/WoW-Audio-v1.9.0-Aung-Gyi-UPDATE-signed.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload v1.9.0 side-by-side test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.9.0-Aung-Gyi-side-by-side-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload v1.9.0 unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.9.0-Aung-Gyi-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 3
          if-no-files-found: error
