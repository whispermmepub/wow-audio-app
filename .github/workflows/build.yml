name: Build WoW Audio v1.2 audiobook player

on:
  push:
    branches: [main, 'rebuild/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'

      - name: Fetch pinned offline Burmese fallback
        run: bash tools/fetch_offline_tts.sh

      - name: Smoke-test offline Burmese fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "sherpa-onnx==1.13.7"
          python3 - <<'PY'
          import math
          import sherpa_onnx

          model = "app/src/main/assets/tts/mya/model.onnx"
          tokens = "app/src/main/assets/tts/mya/tokens.txt"
          config = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=model, tokens=tokens, data_dir=""),
                  num_threads=2,
                  debug=False,
                  provider="cpu",
              ),
              max_num_sentences=1,
          )
          assert config.validate(), "Sherpa rejected the Burmese VITS fallback config"
          tts = sherpa_onnx.OfflineTts(config)
          audio = tts.generate("မင်္ဂလာပါ မြန်မာနိုင်ငံ", sid=0, speed=1.0)
          samples = list(audio.samples)
          count = len(samples)
          rate = int(audio.sample_rate)
          peak = max(abs(float(x)) for x in samples) if samples else 0.0
          rms = math.sqrt(sum(float(x) * float(x) for x in samples) / count) if count else 0.0
          print(f"Offline fallback: {count} samples at {rate} Hz, rms={rms:.6f}, peak={peak:.6f}")
          assert rate > 0 and count > 1000
          assert rms > 0.00001 and peak > 0.00010
          PY

      - name: Smoke-test Nilar and Thiha natural online voices
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "edge-tts==7.2.8"
          edge-tts --list-voices > /tmp/voices.txt
          grep -q 'my-MM-NilarNeural' /tmp/voices.txt
          grep -q 'my-MM-ThihaNeural' /tmp/voices.txt
          edge-tts --voice my-MM-NilarNeural --text 'မင်္ဂလာပါ။ WoW Audio မှ ကြိုဆိုပါတယ်။' --write-media /tmp/nilar.mp3
          edge-tts --voice my-MM-ThihaNeural --text 'မင်္ဂလာပါ။ WoW Audio မှ ကြိုဆိုပါတယ်။' --write-media /tmp/thiha.mp3
          test "$(stat -c%s /tmp/nilar.mp3)" -gt 3000
          test "$(stat -c%s /tmp/thiha.mp3)" -gt 3000

      - name: Verify v1.2 audiobook contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowaudio'" app/build.gradle
          grep -q "versionCode 4" app/build.gradle
          grep -q "versionName '1.2.0'" app/build.gradle
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'LibraryActivity' app/src/main/AndroidManifest.xml
          grep -q 'PlayerActivity' app/src/main/AndroidManifest.xml
          grep -q 'SettingsActivity' app/src/main/AndroidManifest.xml
          grep -q 'AudiobookService' app/src/main/AndroidManifest.xml
          grep -q 'class GeminiTtsClient' app/src/main/java/com/whisper/wowaudio/GeminiTtsClient.java
          grep -q 'gemini-3.1-flash-tts-preview' app/src/main/java/com/whisper/wowaudio/VoiceSettings.java
          grep -q 'AndroidKeyStore' app/src/main/java/com/whisper/wowaudio/SecureApiKeyStore.java
          grep -q 'ACTION_SEEK_BOOK_PROGRESS' app/src/main/java/com/whisper/wowaudio/AudiobookService.java
          grep -q 'BookCover.load' app/src/main/java/com/whisper/wowaudio/LibraryActivity.java
          grep -q 'SeekBar' app/src/main/java/com/whisper/wowaudio/PlayerActivity.java
          grep -q 'GEMINI_VOICES' app/src/main/java/com/whisper/wowaudio/SettingsActivity.java
          grep -q 'my-MM-NilarNeural' app/src/main/java/com/whisper/wowaudio/EdgeMyanmarTtsClient.java
          grep -q 'my-MM-ThihaNeural' app/src/main/java/com/whisper/wowaudio/EdgeMyanmarTtsClient.java
          grep -q 'SEND_MULTIPLE' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/tts/mya/model.onnx
          test -s app/src/main/assets/tts/mya/tokens.txt
          test -s app/libs/sherpa-onnx-1.13.7.aar
          git diff --check

      - name: Test exact Java client, build and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintRelease --stacktrace

      - name: Verify APK identity and fallback assets
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowaudio'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='4'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='1.2.0'"
          "$AAPT" dump badging "$APK" | grep -q "sdkVersion:'23'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          unzip -l "$APK" | grep -q 'assets/tts/mya/model.onnx'
          unzip -l "$APK" | grep -q 'assets/tts/mya/tokens.txt'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          ls -lh "$APK"

      - name: Upload v1.2.0 test APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.2.0-audiobook-player-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload v1.2.0 unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Audio-v1.2.0-audiobook-player-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 3
          if-no-files-found: error
