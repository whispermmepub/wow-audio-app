name: Apply Nilar Thiha Audiobook v5

on:
  push:
    branches:
      - feature/v1.9.0-aung-gyi-f5-local
    paths:
      - '.github/workflows/apply-nilar-thiha-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.9.0-aung-gyi-f5-local
      - name: Apply patch
        run: python3 tools/apply_nilar_thiha_v5.py
      - name: Validate
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowaudio/BurmeseProsody.java app/src/main/java/com/whisper/wowaudio/VoiceSettings.java app/src/main/java/com/whisper/wowaudio/SettingsActivity.java .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Make Nilar and Thiha the polished primary voices'
            git push origin HEAD:feature/v1.9.0-aung-gyi-f5-local
          fi
